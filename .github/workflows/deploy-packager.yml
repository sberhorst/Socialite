name: Deploy via BigWigs Packager

on:
  push:
    branches:
      - main
    tags:
      - "*"

# Triggers on main, not master. This fork's master is an exact mirror of
# upstream (solocommand/Socialite) and carries none of our work, so a
# packager run from it would publish upstream's build under our project.
# Our own code lives on main, which is where a release should be cut from.
#
# Before this, the trigger pointed at master while every commit we made went
# to a feature branch, so the packager never ran at all -- no failed runs,
# nothing red, just a pipeline that silently never fired.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Package and Release
        uses: BigWigsMods/packager@master
